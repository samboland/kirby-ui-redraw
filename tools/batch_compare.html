<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirby texture comparison</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181c24;color:#edf0f7;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #465063}h1{font-size:22px;margin:0 0 10px}button,input,select{font:inherit;background:#303846;color:inherit;border:1px solid #68748a;border-radius:5px;padding:7px}button{cursor:pointer}header label{display:inline-block;margin:6px 12px 0 0}main{display:grid;grid-template-columns:290px 1fr;height:calc(100vh - 166px)}aside{overflow:auto;padding:12px;border-right:1px solid #465063}#search{width:100%;margin-bottom:12px}#list button{display:block;width:100%;text-align:left;font-size:12px;overflow-wrap:anywhere;margin:5px 0}#list button.active{background:#315788;border-color:#9ac8ff}article{min-width:0;padding:16px}#name{overflow-wrap:anywhere;margin-bottom:10px}#panes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.viewport{height:calc(100vh - 265px);overflow:auto;background-color:#ccc;background-image:conic-gradient(#999 25%,transparent 0 50%,#999 0 75%,transparent 0);background-size:24px 24px}canvas{display:block;image-rendering:pixelated}h2{font-size:15px;margin:0 0 8px}#status{color:#bbc8df}a{color:#a5cfff}@media(max-width:800px){main{grid-template-columns:180px 1fr}#panes{grid-template-columns:1fr}.viewport{height:38vh}}
</style>
<header><h1>Original / upscaled</h1><span id="status">Loading batch…</span><br>
<button id="prev">← Previous</button> <button id="next">Next →</button>
<label>View <select id="channel"><option value="rgba">Color + alpha</option><option value="alpha">Alpha only</option><option value="rgb">RGB without alpha</option></select></label>
<label>Background <select id="bg"><option value="checker">Checkerboard</option><option value="#fff">White</option><option value="#000">Black</option><option value="#808080">Gray</option></select></label>
<label>Zoom <select id="zoom"><option value="0.5">50%</option><option value="1" selected>100%</option><option value="2">200%</option><option value="4">400%</option></select></label>
<label><input type="checkbox" id="smooth"> Smooth original</label></header>
<main><aside><input id="search" placeholder="Filter filename or size" aria-label="Filter textures"><div id="list"></div></aside><article><div id="name"></div><div id="panes"><section><h2 id="leftTitle">Original</h2><div class="viewport"><canvas id="left"></canvas></div></section><section><h2 id="rightTitle">Upscaled</h2><div class="viewport"><canvas id="right"></canvas></div></section></div><p>Both images use the same display size. Scroll is synchronized. Original pixels stay sharp unless “Smooth original” is enabled.</p></article></main>
<script>
const $=id=>document.getElementById(id);let rows=[],selected='',pictures=null,token=0;
function filtered(){const q=$('search').value.toLowerCase();return rows.filter(r=>(r.name+' '+r.source_size.join('x')).toLowerCase().includes(q))}
function list(){const frag=document.createDocumentFragment();for(const r of filtered()){const b=document.createElement('button');b.textContent=r.name;b.className=r.name===selected?'active':'';b.onclick=()=>choose(r.name);frag.append(b)}$('list').replaceChildren(frag)}
function load(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error('Could not load '+src));i.src=src})}
async function choose(name){selected=name;location.hash=encodeURIComponent(name);list();const t=++token,r=rows.find(r=>r.name===name);if(!r)return;try{const ims=await Promise.all([load('originals/'+encodeURIComponent(name)),load(encodeURIComponent(name))]);if(t!==token)return;pictures={r,ims};$('name').textContent=name;$('leftTitle').textContent='Original · '+r.source_size.join(' × ');$('rightTitle').textContent='Upscaled · '+r.output_size.join(' × ');draw()}catch(e){$('name').textContent=e.message}}
function draw(){if(!pictures)return;const {r,ims}=pictures;ims.forEach((im,i)=>{const c=$(i?'right':'left'),tmp=document.createElement('canvas');tmp.width=im.width;tmp.height=im.height;const tx=tmp.getContext('2d');tx.drawImage(im,0,0);const mode=$('channel').value;if(mode!=='rgba'){const d=tx.getImageData(0,0,tmp.width,tmp.height);for(let k=0;k<d.data.length;k+=4){if(mode==='alpha')d.data[k]=d.data[k+1]=d.data[k+2]=d.data[k+3];d.data[k+3]=255}tx.putImageData(d,0,0)}c.width=r.output_size[0];c.height=r.output_size[1];const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=i===0&&$('smooth').checked;ctx.drawImage(tmp,0,0,c.width,c.height);c.style.width=c.width*Number($('zoom').value)+'px';c.style.height=c.height*Number($('zoom').value)+'px'})}
async function refresh(){try{const r=await(await fetch('report.json',{cache:'no-store'})).json();$('status').textContent=r.status+' · '+r.results.length+' / '+r.total+' completed';if(rows.length!==r.results.length){rows=r.results;list()}if(!selected&&rows.length){const hash=decodeURIComponent(location.hash.slice(1));choose(rows.some(r=>r.name===hash)?hash:rows[rows.length-1].name)}}catch(e){$('status').textContent='Cannot refresh report: '+e.message}}
$('search').oninput=list;for(const id of ['channel','zoom','smooth'])$(id).onchange=draw;
$('bg').onchange=()=>document.querySelectorAll('.viewport').forEach(v=>{v.style.backgroundColor=$('bg').value==='checker'?'#ccc':$('bg').value;v.style.backgroundImage=$('bg').value==='checker'?'':'none'});
function step(n){const f=filtered(),i=f.findIndex(r=>r.name===selected);if(f.length)choose(f[Math.max(0,Math.min(f.length-1,i+n))].name)}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
const panes=[...document.querySelectorAll('.viewport')];panes.forEach((p,i)=>p.addEventListener('scroll',()=>{const q=panes[1-i];if(q.scrollLeft!==p.scrollLeft)q.scrollLeft=p.scrollLeft;if(q.scrollTop!==p.scrollTop)q.scrollTop=p.scrollTop}));refresh();setInterval(refresh,5000);
</script>
